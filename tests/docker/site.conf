server {
    listen 80 default_server;
    root /var/www/html;
    index index.php;
    access_log /var/log/nginx/access.log;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
