name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04      # older glibc -> runs on most distros
          - ubuntu-22.04-arm
          - macos-14          # arm64
          - macos-13          # x86_64
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[build,dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: python scripts/build.py --ci
      - uses: actions/upload-artifact@v4
        with:
          name: zir-${{ matrix.os }}
          path: dist/zir-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum zir-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
