name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please remove host names, IP addresses, user names and log lines you do not want to make public.
        Security problems: see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zir SSH version
      description: Output of `zir --version`
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Your computer
      description: OS and terminal, e.g. "macOS 15, iTerm2" or "Windows 11, Windows Terminal"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: Distribution and the software involved, e.g. "Debian 12, nginx, PHP-FPM 8.2, MariaDB 10.11"
  - type: textarea
    id: logs
    attributes:
      label: Output or error message
      render: text
